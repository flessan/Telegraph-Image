<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>Remote Storage Console · Telegraph-Image</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="console-body">
  <a class="skip-link" href="#main" data-i18n="skipToContent">Skip to files</a>

  <div class="console" id="console">
    <header class="console-header">
      <div class="header-lead">
        <button class="icon-btn nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="side-nav" data-i18n-aria="adminNavAria">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a class="brand" href="/admin.html">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="8.5" width="13" height="12" rx="2"/>
              <path d="M7.5 8.5V6.2A2.2 2.2 0 0 1 9.7 4h10.1A1.7 1.7 0 0 1 21.5 5.7v10.6a2.2 2.2 0 0 1-2.2 2.2H16.5"/>
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-name" data-i18n="adminTitle">Remote Storage Console</span>
            <span class="brand-tag" data-i18n="adminTagline">Manage the remote object store</span>
          </span>
        </a>
      </div>

      <div class="header-search">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.25"/><path d="M16 16l4 4"/></svg>
        </span>
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               data-i18n-placeholder="consoleSearchPlaceholder" data-i18n-aria="adminSearchAria" placeholder="Search objects">
        <button type="button" class="icon-btn search-clear" id="search-clear" hidden data-i18n-aria="clearSearch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="header-tools" role="toolbar" data-i18n-aria="utilities">
        <button class="icon-btn" id="refresh-btn" data-i18n-aria="refreshRemote" data-i18n-title="refreshRemote" title="">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.2-5.5"/><path d="M20 4v5h-5"/></svg>
        </button>
        <button class="tool-btn hide-compact" id="palette-btn" data-i18n-aria="commandTitle" data-i18n-title="commandTitle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 9h6M9 12h6M9 15h4"/><rect x="3" y="4" width="18" height="16" rx="3"/></svg>
          <kbd class="tool-kbd">⌘K</kbd>
        </button>

        <span class="tool-divider" aria-hidden="true"></span>

        <button class="icon-btn" id="theme-btn" data-i18n-aria="themeToggleAria" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="tool-btn" id="lang-btn" data-i18n-aria="languageAria" data-i18n-title="language">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 3 3.9 6 3.9 9s-1.3 6-3.9 9c-2.6-3-3.9-6-3.9-9S9.4 6 12 3z"/></svg>
          <span class="tool-code" id="lang-code">EN</span>
        </button>
        <a class="icon-btn hide-compact" href="/" data-i18n-aria="returnHome" data-i18n-title="returnHome">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg>
        </a>
      </div>
    </header>

    <nav class="console-nav" id="side-nav" data-i18n-aria="adminNavAria" aria-label="Console navigation">
      <div class="nav-head">
        <span class="brand-name" data-i18n="adminTitle">Remote Storage Console</span>
        <button class="icon-btn" id="nav-close" data-i18n-aria="closeNav">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="nav-scroll">
        <div class="nav-group">
          <button class="nav-item" data-view="overview" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
            <span class="nav-label" data-i18n="consoleOverview">Overview</span>
          </button>
        </div>

        <div class="nav-group">
          <h2 class="nav-section-label" data-i18n="navSectionLibrary">Library</h2>
          <button class="nav-item" data-view="all">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H10l2 2h5.5A2.5 2.5 0 0 1 20 9.5v8A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-10z"/></svg>
            <span class="nav-label" data-i18n="navAllFiles">All files</span>
            <span class="nav-count" id="count-all">0</span>
          </button>
          <button class="nav-item" data-view="images">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3.8 16.5l4.4-4.2 3.1 3 2.4-2.3 6.3 5.3"/></svg>
            <span class="nav-label" data-i18n="navImages">Images</span>
            <span class="nav-count" id="count-images">0</span>
          </button>
          <button class="nav-item" data-view="recent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.25"/><path d="M12 8v4.4l2.8 1.6"/></svg>
            <span class="nav-label" data-i18n="navRecent">Recent</span>
          </button>
        </div>

        <div class="nav-group">
          <h2 class="nav-section-label" data-i18n="metaModeration">Moderation</h2>
          <button class="nav-item" data-view="whitelist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.4 8-8 9-4.6-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
            <span class="nav-label" data-i18n="navWhitelist">Whitelist</span>
            <span class="nav-count" id="count-white">0</span>
          </button>
          <button class="nav-item" data-view="blacklist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
            <span class="nav-label" data-i18n="navBlacklist">Blacklist</span>
            <span class="nav-count" id="count-block">0</span>
          </button>
        </div>
      </div>

      <div class="nav-footer">
        <a class="nav-item nav-item-link show-compact" href="/" data-i18n-aria="returnHome">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg>
          <span class="nav-label" data-i18n="returnHome">Back to workspace</span>
        </a>
        <button class="btn btn-outlined btn-block" id="logout-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h12"/></svg>
          <span data-i18n="logout">Sign out</span>
        </button>
      </div>
    </nav>

    <main class="console-main" id="main">
      <!-- rendered by admin.js -->
    </main>

    <footer class="console-footer" id="footer">
      <span id="footer-status"></span>
      <span class="spacer"></span>
      <span id="footer-index"></span>
    </footer>
  </div>

  <!-- backdrop for mobile nav + sheets -->
  <div class="sheet-backdrop" id="backdrop" hidden></div>

  <!-- Detail side sheet -->
  <aside class="sheet is-admin" id="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
    <div class="sheet-header">
      <button class="icon-btn" id="detail-close" data-i18n-aria="closeDetails">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h2 id="detail-title" data-i18n="detailsTitle">Object details</h2>
    </div>
    <div class="sheet-body" id="detail-body"></div>
    <div class="sheet-actions" id="detail-actions"></div>
  </aside>

  <!-- Generic dialog -->
  <div class="scrim" id="dialog-scrim" hidden></div>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden>
    <h2 id="dialog-title"></h2>
    <p id="dialog-body"></p>
    <div id="dialog-extra"></div>
    <div class="dialog-actions" id="dialog-actions"></div>
  </div>

  <!-- Rename dialog host -->
  <template id="rename-template">
    <label class="field" for="rename-input">
      <span class="field-label" data-i18n="renamePrompt">Display filename</span>
      <input class="field-control" id="rename-input" type="text" maxlength="64" autocomplete="off">
      <span class="field-error" id="rename-error"></span>
    </label>
  </template>

  <!-- Command palette -->
  <div class="scrim" id="palette-scrim" hidden></div>
  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-labelledby="palette-title" hidden>
    <h2 id="palette-title" class="sr-only" data-i18n="commandTitle">Commands</h2>
    <input id="palette-input" type="text" autocomplete="off" spellcheck="false"
           data-i18n-placeholder="commandPlaceholder" placeholder="Type a command">
    <div class="palette-results" id="palette-results" role="listbox"></div>
  </div>

  <!-- Snackbar -->
  <div class="snackbar" id="snackbar" role="status" aria-live="polite">
    <span id="snackbar-text"></span>
    <button class="snackbar-action" id="snackbar-action" hidden></button>
  </div>

  <!-- Live region for a11y announcements -->
  <div id="live" class="sr-only" aria-live="polite"></div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
