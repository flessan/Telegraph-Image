<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <title>Sign in · Telegraph-Image</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="login-body">
  <a class="skip-link" href="#username" data-i18n="skipToContent">Skip to sign in</a>

  <main class="login-card" role="main">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="8.5" width="13" height="12" rx="2"/>
          <path d="M7.5 8.5V6.2A2.2 2.2 0 0 1 9.7 4h10.1A1.7 1.7 0 0 1 21.5 5.7v10.6a2.2 2.2 0 0 1-2.2 2.2H16.5"/>
        </svg>
      </span>
      <span>
        <h1 id="site-name">Telegraph-Image</h1>
        <span class="brand-tag" data-i18n="adminTagline">Remote storage</span>
      </span>
    </div>

    <h2 data-i18n="loginWelcome">Welcome back</h2>
    <p class="login-sub" data-i18n="loginSubtitle">Sign in to manage your remote storage.</p>

    <div id="login-error" class="login-error" role="alert" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M12 8v4.5M12 16h.01"/>
      </svg>
      <span id="login-error-text"></span>
    </div>

    <form id="login-form" class="login-form" novalidate>
      <div class="field" id="field-user">
        <label class="field-label" for="username" data-i18n="usernameLabel">Username</label>
        <input class="field-control" id="username" name="username" type="text" autocomplete="username"
               autocapitalize="off" autocorrect="off" spellcheck="false" required
               data-i18n-aria="usernameLabel" data-i18n-placeholder="usernamePlaceholder" placeholder="Enter your username">
      </div>

      <div class="field" id="field-pass">
        <label class="field-label" for="password" data-i18n="passwordLabel">Password</label>
        <div style="position:relative">
          <input class="field-control has-toggle" id="password" name="password" type="password" autocomplete="current-password" required
                 data-i18n-aria="passwordLabel" data-i18n-placeholder="passwordPlaceholder" placeholder="Enter your password">
          <button type="button" class="icon-btn password-toggle" id="toggle-pass"
                  data-i18n-aria="showPassword" aria-pressed="false">
            <svg id="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="field-error" id="field-pass-error"></span>
      </div>

      <button type="submit" class="btn btn-filled btn-block" id="submit-btn">
        <span class="spinner" id="submit-spinner" hidden></span>
        <span id="submit-label" data-i18n="signIn">Sign in</span>
      </button>
    </form>

    <div class="login-footer">
      <a href="/" data-i18n="returnHome">Back to workspace</a>
      <span class="lang-theme">
        <button type="button" class="icon-btn" id="theme-btn" data-i18n-aria="themeToggleAria" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" class="icon-btn" id="lang-btn" data-i18n-aria="languageAria">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 3 3.9 6 3.9 9s-1.3 6-3.9 9c-2.6-3-3.9-6-3.9-9S9.4 6 12 3z"/></svg>
        </button>
      </span>
    </div>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
